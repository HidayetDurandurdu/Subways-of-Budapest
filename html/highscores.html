<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budapest Metro Game - High Scores</title>
    <!-- Bootstrap CSS only NO JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- My custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Notification Container -->
    <div id="notificationContainer"></div>

    <main>
        <section id="highscores-section">
            <div class="container d-flex flex-column justify-content-center align-items-center h-100">
                <div class="highscores-wrapper">
                    <div class="highscores-header">
                        <h1>🏆 High Scores</h1>
                        <p>Top players from all accounts</p>
                    </div>
                    
                    <div class="highscores-body">
                        <!-- Leaderboard will be generated here -->
                        <div id="leaderboard"></div>
                    </div>
                    
                    <div class="highscores-footer">
                        <a href="./main-menu.html" class="w-100">
                            <button class="secondary-button w-100">Back to Menu</button>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../js/Menu/auth.js"></script>
    <script src="../js/Menu/notifications.js"></script>
    <script src="../js/Highscores/highscores.js"></script>
    <script src="../js/menu-bg-effect.js"></script>
</body>
</html>
